version: 0.2

phases:
  install:
    commands:
      - echo Installing AWS CLI...
      - yum install -y aws-cli
  build:
    commands:
      - echo "Building application ${APPLICATION_NAME}..."
      - cd ${APPLICATION_NAME}
      - echo "Running build commands for ${APPLICATION_NAME}"
      # Add any specific build steps for task1 here
  post_build:
    commands:
      - echo "Deploying ${APPLICATION_NAME} files to S3..."
      - aws s3 cp . s3://staticwebsite-deploy-codepipeline --recursive --exclude ".git/*" --exclude "buildspec.yml"
