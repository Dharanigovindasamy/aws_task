AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Service with Load Balancer Integration

Resources:
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: NLBListener # Ensure NLBListener is created before the service
    Properties:
      Cluster: !Ref ECSCluster
      DesiredCount: 1
      LaunchType: FARGATE
      TaskDefinition: !Ref ECSTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - subnet-06f641326b15e35f1
            - subnet-07c96a8bc347064e9
            - subnet-0a8d8d15fd2251b3f
            - subnet-0d46a5192b018fefb
            - subnet-091fbb697e19ff92e
            - subnet-07fbe67094889ea4a
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: MyAppContainer
          ContainerPort: 80
          TargetGroupArn: !Ref TargetGroup
